schemaVersion: 2
taxonomyId: decisions.default
decisionRoot: docs/decisions
legacyRoots:
  - docs/adr
maxLeafDocuments: 24
routes:
  - id: security
    path: security
    priority: 100
    minimumTitleTermMatches: 1
    titleTerms:
      - security
      - authentication
      - authorization
      - credential
      - privacy
      - encryption
  - id: data
    path: data
    priority: 90
    minimumTitleTermMatches: 1
    titleTerms:
      - data
      - database
      - schema
      - storage
      - persistence
      - migration
  - id: architecture
    path: architecture
    priority: 80
    minimumTitleTermMatches: 1
    titleTerms:
      - architecture
      - motion engine
      - system boundary
      - component
      - integration
      - protocol
      - api
  - id: product
    path: product
    priority: 70
    minimumTitleTermMatches: 1
    titleTerms:
      - product
      - user experience
      - requirement
      - scope
      - workflow
      - feature
  - id: delivery
    path: delivery
    priority: 60
    minimumTitleTermMatches: 1
    titleTerms:
      - release
      - deployment
      - deploy
      - distribution
      - packaging
      - build
      - continuous integration
  - id: operations
    path: operations
    priority: 50
    minimumTitleTermMatches: 1
    titleTerms:
      - runtime
      - operations
      - observability
      - monitoring
      - doctor
      - diagnostic
      - incident
      - recovery
  - id: quality
    path: quality
    priority: 40
    minimumTitleTermMatches: 1
    titleTerms:
      - testing
      - verification
      - quality
      - reliability
      - performance
      - accessibility
  - id: development
    path: development
    priority: 30
    minimumTitleTermMatches: 1
    titleTerms:
      - developer tooling
      - dependency
      - code style
      - repository
      - monorepo
documentPolicy:
  capacity:
    maxDirectDocuments: 32
    maxDocumentBearingChildDirectories: 32
    maxRepositoryDocuments: 4096
    maxNormalizedFamilyOutputs: 12
    overrides: []
  roles:
    - roleId: public_overview
      scopePath: .
      path: README.md
      cardinality: one
      lifecycleOwner: user
      relocation: preserve
      rewritePolicy: repository_tool
      required: false
    - roleId: product_vision
      scopePath: .
      path: docs/product/vision.md
      cardinality: one
      lifecycleOwner: user
      relocation: reviewed_move
      rewritePolicy: reviewed_exact
      required: false
      legacyAliases:
        - VISION.md
        - PRODUCT_VISION.md
    - roleId: system_architecture
      scopePath: .
      path: docs/architecture/system.md
      cardinality: one
      lifecycleOwner: user
      relocation: reviewed_move
      rewritePolicy: reviewed_exact
      required: false
      legacyAliases:
        - ARCHITECTURE.md
        - SYSTEM_ARCHITECTURE.md
    - roleId: execution_specification
      scopePath: .
      path: docs/specifications/execution.md
      cardinality: one
      lifecycleOwner: user
      relocation: reviewed_move
      rewritePolicy: reviewed_exact
      required: false
      legacyAliases:
        - EXECUTION_SPEC.md
        - EXECUTION_SPECIFICATION.md
    - roleId: delivery_roadmap
      scopePath: .
      path: docs/roadmap/index.md
      cardinality: one
      lifecycleOwner: user
      relocation: reviewed_move
      rewritePolicy: reviewed_exact
      required: false
      legacyAliases:
        - ROADMAP.md
    - roleId: continuation_source
      scopePath: .
      path: .lervo/state/workstreams/current.json
      cardinality: one
      lifecycleOwner: lervo
      relocation: exact_legacy_alias
      rewritePolicy: lervo_exact
      required: false
      legacyAliases:
        - HANDOFF.md
  rewrite:
    maxRewriters: 16
    maxManagedRulesPerRewriter: 256
    maxManagedRuleBytes: 16384
