name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Ceiling, not a target: this job lands in ~2 minutes. GitHub's default is
    # SIX HOURS, which turns any hang into a required check that never reports
    # — and with the ruleset's strict policy, one stuck job blocks every other
    # PR's merge too.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Same ceiling reasoning as Verify. This job lands in ~5 minutes; 25 leaves
    # room for a slow runner without leaving a hang parked for hours.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # INCIDENT (2026-08-19): both install steps below hang on the runner —
      # observed four times in one day across PRs #274, #246 (twice) and #250,
      # sitting 20-22 minutes with no output before someone cancelled the run.
      # Both shell out to network work (the Playwright CDN download, and apt for
      # the system libraries), so a stalled connection parks the step with no
      # timeout of its own. Bounded per ATTEMPT and retried: a transient stall
      # costs one attempt instead of the whole job, and a genuine outage fails
      # the check in minutes so the queue keeps moving.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 5m pnpm --filter @flemo/web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt stalled or failed; retrying"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        # Two attempts, not three: this one drives apt, and killing it mid-
        # transaction can leave dpkg locked for whatever follows. One retry
        # covers a stalled mirror; more just replays the lock.
        run: |
          for attempt in 1 2; do
            if timeout 5m pnpm --filter @flemo/web exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps attempt $attempt stalled or failed; retrying"
            sleep 15
          done
          echo "::error::playwright install-deps failed after 2 attempts"
          exit 1

      - name: Build workspace deps for @flemo/web
        run: pnpm turbo run build --filter=@flemo/web

      - name: Playwright
        # The suite runs in ~30s locally and ~2min on a CI runner; 15 bounds a
        # wedged browser without touching a legitimately slow run.
        timeout-minutes: 15
        # Run the public site suite in both desktop and mobile Chromium.
        run: pnpm --filter @flemo/web exec playwright test --project=chromium --project=mobile-chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
