name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC). Without it the runner cannot
  # mint the ID token that `pnpm publish` exchanges for a short-lived
  # registry credential, and publishing falls back to nothing.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Mint an App-installation token. PRs opened with the default
      # `secrets.GITHUB_TOKEN` are silently demoted by GitHub. `pull_request`
      # events on those PRs do NOT trigger other workflows (the
      # infinite-loop guard). That left required CI checks (Verify / E2E /
      # Playwright) stuck on "Expected — waiting for status to be reported"
      # on every Version PR. An App token is a real external identity, so
      # downstream workflows fire normally.
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # No `version:` input — the pnpm release comes from `packageManager` in
      # the root package.json. Trusted publishing needs pnpm >= 11.1.3, which
      # stopped passing an unresolved `${NODE_AUTH_TOKEN}` placeholder to the
      # registry as a literal bearer token (pnpm/pnpm#11513). Don't downgrade
      # that pin below 11.1.3 or publishes go back to failing with E404.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # Deliberately no `registry-url:`. That input makes setup-node write a
      # user .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` — a token line
      # we no longer have a token for. Omitting it leaves no auth file at all,
      # so OIDC is the only credential in play. The registry itself is not
      # lost: changesets sets `npm_config_registry` per package from each
      # package.json's publishConfig (all four are registry.npmjs.org).
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"

      # Publishing runs on npm trusted publishing (OIDC) — there is no npm
      # token here on purpose. `pnpm release` shells out to `changeset
      # publish`, which detects the pnpm workspace and spawns `pnpm publish`
      # once per package; each of those independently exchanges the GitHub
      # OIDC ID token for a short-lived registry credential.
      #
      # This only works while npmjs.com lists this repo as a trusted publisher
      # for every published package (@flemo/core, @flemo/react,
      # @flemo/devtools). The registered workflow
      # filename is `release.yml` — bare, not the `.github/workflows/` path —
      # so renaming or moving this file silently breaks releases with a 404
      # on PUT. npm masks auth failures as 404, so that is the symptom to
      # expect, not a 401.
      # v2 RENAMED EVERY INPUT AND STOPPED READING THE TOKEN FROM THE ENV.
      # `github-token` defaults to `${{ github.token }}`, so an App token left
      # in `env: GITHUB_TOKEN` is not picked up and is silently replaced by
      # the default one. That is the exact failure the token step above
      # exists to avoid: PRs opened with the default token do not trigger
      # downstream workflows, and the Version PR sits on "Expected — waiting
      # for status to be reported" for Verify and E2E forever. Pass it HERE.
      #
      # Release commits and tags now go through the GitHub API rather than
      # the Git CLI (`push-with-git-cli` defaults to false), so they are
      # signed with GitHub's GPG key and attributed to the App that owns the
      # token. `create-github-releases` and `push-git-tags` both default to
      # true, which is what v1 did, so releases and tags are unchanged.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
